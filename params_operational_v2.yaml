# OPS-1 v2 Floodplain-augmented Operational Stage-Response Test -- pre-registered (2026-11-01).
# Rationale and derivations: docs/5_operational_floodplain_v2.md (local, git-excluded).
# Committed BEFORE any v2 result; never edited afterwards. Observation rules, bins, models,
# fallback shape and contrasts are inherited unchanged from params_operational.yaml (v1).
version: 2
inherits:
  file: params_operational.yaml
  sha256: 839237d3d385bc9a54353bac8a9485cfd48118e80ffc33b8c86aec6ef30fc205

datum:
  accepted: [NAVD88, NGVD29]              # 3: others excluded
  ncat_url: https://geodesy.noaa.gov/api/ncat/llh
  anchor_dem_max_offset_m: 5.0            # 3: |z_ch - WSE_a| <= 5 m

transect:
  service_url: https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/getSamples
  n_samples: 1000                         # 2: 1,001 points (service maximum)
  length_factor_w: 40.0                   # 2: L = clamp(40 W_a, 400, 8000) m
  length_min_m: 400.0
  length_max_m: 8000.0
  offset_factor_w: 3.0                    # 2: offset = max(3 W_a, 150 m) upstream
  offset_min_m: 150.0
  bearing_half_window_m: 50.0             # flowline bearing from +-50 m around the centre
  channel_search_factor_w: 3.0            # 2: channel search +-max(3 W_a, 100 m)
  channel_search_min_m: 100.0
  flat_tol_m: 0.05                        # 2: flat (hydro-flattened) run tolerance
  max_flowline_offset_m: 500.0            # 3: gauge-to-flowline distance limit
  max_nodata_share: 0.05                  # 3: > 5 % no-data samples -> excluded

acquisition:
  workers: 6
  timeout_s: 60.0
  retries: 3

section:
  channel_points: 401                     # dense model-channel grid added to the DEM grid
  z_levels: 300                           # 2: ln Q interpolation levels

scoring:
  variants: [control, floodplain]
  families: [S-ID, S-LRO]
  noninferiority_margin_m: 0.05           # H-FP2
