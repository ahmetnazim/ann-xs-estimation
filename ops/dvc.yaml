# ops/dvc.yaml -- OPS-1 Operational Stage-Response Test (post-release extension of v1.0.0).
# Kept separate from the frozen root dvc.yaml/dvc.lock (reports/archival_manifest.json).
# Pre-registration: params_operational.yaml (commit 8743c46); rationale in
# docs/4_operational_stage_response.md (local). JSON/Markdown results are git-tracked (cache: false),
# like reports/results/*; the large Parquet tables are DVC-cached.
# Run from the repo root:  uv run dvc repro --single-item ops/dvc.yaml:ops1
stages:
  ops1:
    wdir: ..
    cmd: python -m scripts.operational
    deps:
      - scripts/operational.py
      - src/operational/__init__.py
      - src/operational/config.py
      - src/operational/rating.py
      - src/operational/observations.py
      - src/operational/evaluate.py
      - src/physics/shape.py
      - src/physics/quadrature.py
      - src/evaluation/bootstrap.py
      - src/data/readers.py
      - data/raw/hydroswot/SWOT_ADCP_Dataset.txt
      - data/processed/unit_mapped/hydroswot.parquet
      - data/processed/site_table.parquet
      - data/processed/predictions/M-null.parquet
      - data/processed/predictions/M0.parquet
      - data/processed/predictions/M1.parquet
      - data/processed/predictions/M2-MLP.parquet
      - data/processed/predictions/M2-XGB.parquet
      - data/processed/predictions/M3.parquet
      - data/processed/predictions/M4.parquet
      - data/processed/predictions/M5.parquet
      - data/processed/predictions/M6-NN.parquet
      - data/processed/predictions/M6-XGB.parquet
    params:
      - params.yaml:
          - solver.quad_level
          - solver.quad_trunc
          - domain.r_bounds
          - evaluation.bootstrap
      - params_operational.yaml:
    outs:
      - reports/operational/ops1_observations.parquet
      - reports/operational/ops1_site_bins.parquet
      - reports/operational/ops1_summary.md: {cache: false}
    metrics:
      - reports/operational/ops1_results.json: {cache: false}

  # OPS-1 v2 (floodplain). Pre-registration: params_operational_v2.yaml (commit c1b6c19);
  # rationale in docs/5_operational_floodplain_v2.md (local). ops2_acquire needs network access
  # (3DEP, NOAA NCAT, NWIS site service); its records are DVC-cached and reused on rerun.
  ops2_acquire:
    wdir: ..
    cmd: python -m scripts.ops2_acquire --workers 16
    deps:
      - scripts/ops2_acquire.py
      - src/operational/transects.py
      - src/operational/config_v2.py
      - data/processed/site_table.parquet
      - data/raw/hydroswot/SWOT_ADCP_Dataset.txt
      - data/raw/nhdplusv21
    params:
      - params_operational_v2.yaml:
          - datum
          - transect
          - acquisition
    outs:
      - data/raw/ops_transects
  ops2:
    wdir: ..
    cmd: python -m scripts.ops2
    deps:
      - scripts/ops2.py
      - src/operational/evaluate_v2.py
      - src/operational/floodplain.py
      - src/operational/evaluate.py
      - src/operational/observations.py
      - src/operational/transects.py
      - src/operational/config.py
      - src/operational/config_v2.py
      - src/evaluation/bootstrap.py
      - data/raw/ops_transects
      - data/raw/hydroswot/SWOT_ADCP_Dataset.txt
      - data/processed/unit_mapped/hydroswot.parquet
      - data/processed/site_table.parquet
      - data/processed/predictions/M-null.parquet
      - data/processed/predictions/M0.parquet
      - data/processed/predictions/M1.parquet
      - data/processed/predictions/M2-MLP.parquet
      - data/processed/predictions/M2-XGB.parquet
      - data/processed/predictions/M3.parquet
      - data/processed/predictions/M4.parquet
      - data/processed/predictions/M5.parquet
      - data/processed/predictions/M6-NN.parquet
      - data/processed/predictions/M6-XGB.parquet
    params:
      - params.yaml:
          - domain.r_bounds
          - evaluation.bootstrap
      - params_operational.yaml:
      - params_operational_v2.yaml:
    outs:
      - reports/operational/ops2_site_bins.parquet
      - reports/operational/ops2_summary.md: {cache: false}
    metrics:
      - reports/operational/ops2_results.json: {cache: false}

  # OPS-1 v3 (all-model regime diagnostics, dynamic-n Oracle, off-anchor states & CCHE1D readiness).
  # Pre-registration: params_operational_v3.yaml (commit 578b342); rationale in
  # docs/6_operational_diagnostics_v3.md (local).
  ops3:
    wdir: ..
    cmd: python -m scripts.ops3
    deps:
      - scripts/ops3.py
      - src/operational/evaluate_v3.py
      - src/operational/evaluate_v2.py
      - src/operational/evaluate.py
      - src/operational/rating.py
      - src/operational/config.py
      - src/operational/config_v2.py
      - src/operational/config_v3.py
      - src/physics/shape.py
      - src/evaluation/bootstrap.py
      - reports/operational/ops1_observations.parquet
      - reports/operational/ops2_site_bins.parquet
      - data/processed/unit_mapped/hydroswot.parquet
      - data/processed/site_table.parquet
      - data/processed/predictions/M-null.parquet
      - data/processed/predictions/M0.parquet
      - data/processed/predictions/M1.parquet
      - data/processed/predictions/M2-MLP.parquet
      - data/processed/predictions/M2-XGB.parquet
      - data/processed/predictions/M3.parquet
      - data/processed/predictions/M4.parquet
      - data/processed/predictions/M5.parquet
      - data/processed/predictions/M6-NN.parquet
      - data/processed/predictions/M6-XGB.parquet
    params:
      - params.yaml:
          - solver.quad_level
          - solver.quad_trunc
          - domain.r_bounds
          - evaluation.bootstrap
      - params_operational.yaml:
      - params_operational_v2.yaml:
      - params_operational_v3.yaml:
    outs:
      - reports/operational/ops3_summary.md: {cache: false}
    metrics:
      - reports/operational/ops3_results.json: {cache: false}
