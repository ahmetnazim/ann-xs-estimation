# DVC pipeline skeleton -- transcribed from docs/3_experimental_protocol.md section 1.5 (Phase 3 gate).
# Not executable yet: `dvc init`, params.yaml and the src/data modules are created in Phases 4-5 (ADL-009, ADL-043).
# Outputs are tracked in dvc.lock; `dvc add` is not used for project data (ADL-043 amends ADL-009).
stages:
  acquire:
    foreach: [hydroswot, nhdplusv21, streamcat, usgs_attrs, d50, aridity,
              physiography, ehydro, ehydro_author, zarrabi_product, hyg]
    do:
      cmd: python -m src.data.acquire --unit ${item}
      deps: [src/data/acquire.py]
      params: ["acquire.${item}"]
      outs: ["data/raw/${item}"]
  validate_raw:
    cmd: python -m src.data.validate_raw
    deps: [src/data/validate_raw.py, src/data/schemas.py, src/data/readers.py, src/data/nhdplus.py,
           src/data/io.py, data/raw/hydroswot, data/raw/nhdplusv21, data/raw/streamcat,
           data/raw/usgs_attrs, data/raw/d50, data/raw/aridity, data/raw/physiography]
    params: [acquire.streamcat]
    metrics: [{reports/validate_raw.json: {cache: false}}]
  unit_map:
    cmd: python -m src.data.unit_map
    deps: [src/data/unit_map.py, src/data/schemas.py, src/data/readers.py, src/data/nhdplus.py,
           src/data/io.py, reports/validate_raw.json, data/raw/hydroswot, data/raw/nhdplusv21]
    params: [domain.s_floor]
    outs: [data/processed/unit_mapped]
  qc:
    cmd: python -m src.data.qc
    deps: [src/data/qc.py, src/data/schemas.py, src/data/io.py, data/processed/unit_mapped,
           data/raw/physiography]
    params: [qc, domain.r_bounds]
    outs: [data/processed/qc/hydroswot_init.parquet]
    metrics: [{reports/qc_counts.json: {cache: false}}]
  link:
    cmd: python -m src.data.link
    deps: [src/data/link.py, src/data/nhdplus.py, src/data/io.py,
           data/processed/qc/hydroswot_init.parquet, data/processed/unit_mapped, data/raw/nhdplusv21]
    params: [link]
    outs: [data/processed/link/site_comid.parquet]
    metrics: [{reports/link_counts.json: {cache: false}}]
  condition_extract:
    cmd: python -m src.data.condition_extract
    deps: [src/data/condition_extract.py, src/data/io.py, data/processed/qc/hydroswot_init.parquet,
           data/processed/link/site_comid.parquet, data/processed/unit_mapped]
    params: [condition]
    outs: [data/processed/site_core.parquet]
    metrics: [{reports/condition_counts.json: {cache: false}}]
  features:
    cmd: python -m src.data.features
    deps: [src/data/features.py, src/data/schemas.py, src/data/readers.py, src/data/nhdplus.py,
           src/data/io.py, src/data/validate_raw.py, data/processed/site_core.parquet,
           data/processed/unit_mapped, data/raw/streamcat, data/raw/usgs_attrs, data/raw/d50,
           data/raw/aridity, data/raw/nhdplusv21]
    params: [features, acquire.streamcat]
    outs: [data/processed/site_table.parquet]
    metrics: [{reports/feature_missing.json: {cache: false}}]
  split:
    cmd: python -m src.data.split
    deps: [src/data/split.py, src/data/schemas.py, src/data/io.py, src/data/qc.py,
           data/processed/site_table.parquet, data/processed/qc/hydroswot_init.parquet,
           data/raw/physiography]
    params: [seeds, splits, uq.ensemble_m]
    outs: [data/processed/splits/fold_assignment.parquet, data/processed/splits/srnd_assignment.parquet]
    metrics: [{reports/split_summary.json: {cache: false}}]
  ind_prepare:
    cmd: python -m src.data.ind_prepare
    deps: [src/data/ind_prepare.py, src/data/ehydro.py, data/raw/ehydro, data/raw/nhdplusv21,
           data/raw/zarrabi_product, data/processed/site_table.parquet,
           reports/ehydro_selection.json]                 # docs/3 11.4 E-R5e
    params: [splits.ind_dedupe_m, ehydro]
    outs: [data/processed/ind/ehydro_ind.parquet]
    metrics: [{reports/ind_prepare.json: {cache: false}}]

  # ---- Phase 8 (docs/3 13.3). Stages 0a/0b build the last two plan-header tables.
  ind_features:                                       # 0a, docs/3 13.5
    cmd: python -m src.data.ind_features
    deps: [src/data/ind_features.py, src/data/features.py, src/data/srnd_frame.py, src/data/qc.py,
           src/data/nhdplus.py, src/data/readers.py, src/data/io.py, src/data/schemas.py,
           src/data/validate_raw.py, data/processed/ind/ehydro_ind.parquet,
           data/processed/unit_mapped, data/raw/streamcat, data/raw/usgs_attrs, data/raw/d50,
           data/raw/aridity, data/raw/nhdplusv21, data/raw/physiography]
    params: [features, acquire.streamcat, transforms.features]
    outs: [data/processed/ind/ehydro_ind_features.parquet]
    metrics: [{reports/ind_features.json: {cache: false}}]
  srnd_frame:                                         # 0b, docs/3 13.6
    cmd: python -m src.data.srnd_frame
    deps: [src/data/srnd_frame.py, src/data/io.py, src/data/schemas.py,
           data/processed/splits/srnd_assignment.parquet, data/processed/qc/hydroswot_init.parquet,
           data/processed/site_table.parquet]
    params: [transforms.features]
    outs: [data/processed/srnd/srnd_frame.parquet]
    metrics: [{reports/srnd_frame.json: {cache: false}}]

  # Stages 1, 2 and 5. Fits live in the run root outside the workspace (docs/3 13.2), so these
  # stages have no outs; the whole params.yaml is a dep because its SHA-256 enters the plan
  # (and so the run_id). The orchestrator refuses NN stages without checkpoint_1 (13.3, 13.4)
  # and a dirty git tree. Run one stage at a time: `dvc repro -s train@<item>`, then track.
  train:
    foreach: [baselines, xgb, nn_primary, ablations, sensitivity]
    do:
      cmd: >-
        python scripts/run_experiment.py plan &&
        python scripts/run_experiment.py run --stage train@${item}
      deps: &run_deps
        [scripts/run_experiment.py, params.yaml, uv.lock, src/config.py, src/models, src/physics,
         src/utils, src/data/dataset.py, src/data/folds.py, src/data/normstats.py, src/data/io.py,
         src/data/srnd_frame.py, src/data/ind_features.py, src/evaluation/ledger.py,
         src/evaluation/metrics.py, data/processed/site_table.parquet,
         data/processed/splits/fold_assignment.parquet,
         data/processed/splits/srnd_assignment.parquet, data/processed/ind/ehydro_ind.parquet,
         data/processed/ind/ehydro_ind_features.parquet, data/processed/srnd/srnd_frame.parquet]

  # docs/3 13.7: registry (DVC out), run manifest and training diagnostics (cache: false),
  # rebuilt from the run root. `run --stage` also refreshes them; `dvc repro -s track` records.
  track:
    cmd: python scripts/run_experiment.py track
    deps: *run_deps
    outs:
      - data/processed/runs/run_registry.parquet
      - reports/run_manifest.json: {cache: false}
      - reports/training/curves.json: {cache: false}
      - reports/training/xi.json: {cache: false}
    metrics: [{reports/training/summary.json: {cache: false}}]

  # Stages 3 and 6 (`predict@audit`, `predict@all`; DVC forbids per-item out lists, hence two
  # stages). persist: DVC must never delete a prediction file before a re-run; a sealed file is
  # refused by the writer if its bytes would change (13.4). Seals are `run_experiment.py seal`.
  predict_audit:
    cmd: python scripts/run_experiment.py predict --stage predict@audit
    deps: *run_deps
    outs:
      - data/processed/predictions/audit_inputs.parquet: {persist: true}
    metrics: [{reports/predictions_audit.json: {cache: false}}]
  predict_all:
    cmd: python scripts/run_experiment.py predict --stage predict@all
    deps: *run_deps
    outs:
      - data/processed/predictions/M-null.parquet: {persist: true}
      - data/processed/predictions/A_J.parquet: {persist: true}
      - data/processed/predictions/M0.parquet: {persist: true}
      - data/processed/predictions/M1.parquet: {persist: true}
      - data/processed/predictions/M1_A4.parquet: {persist: true}
      - data/processed/predictions/M2-XGB.parquet: {persist: true}
      - data/processed/predictions/M2-XGB_A4.parquet: {persist: true}
      - data/processed/predictions/M6-XGB.parquet: {persist: true}
      - data/processed/predictions/M2-MLP.parquet: {persist: true}
      - data/processed/predictions/M2-MLP_A4.parquet: {persist: true}
      - data/processed/predictions/M3.parquet: {persist: true}
      - data/processed/predictions/M4.parquet: {persist: true}
      - data/processed/predictions/M5.parquet: {persist: true}
      - data/processed/predictions/M5_A1.parquet: {persist: true}
      - data/processed/predictions/M5_A2.parquet: {persist: true}
      - data/processed/predictions/M5_A3-SP.parquet: {persist: true}
      - data/processed/predictions/M5_A3-SR.parquet: {persist: true}
      - data/processed/predictions/M5_A4.parquet: {persist: true}
      - data/processed/predictions/M5_wA1.parquet: {persist: true}
      - data/processed/predictions/M6-NN.parquet: {persist: true}
    metrics: [{reports/predictions_all.json: {cache: false}}]

  # Stages 4 and 7 (docs/3 13.3, 13.4): scoring events behind the ledger guard. Each refuses
  # unless the previous ledger step is recorded, the ledger header matches the recomputed plan,
  # params.yaml and uv.lock, the tree (ledger included) is clean and committed, and every
  # prediction input hashes as sealed. A recorded event is never re-run. Outs are cache: false
  # and persist: DVC must not delete a recorded output before a refused re-run. The ledger and
  # reports/results/event_attempts.json are git-tracked, not DVC outs (C3b-l).
  audit:                                              # 4, Event 1 (docs/3 3.6)
    cmd: python scripts/audit.py
    deps:
      [scripts/audit.py, params.yaml, uv.lock, src/config.py, src/evaluation/events.py,
       src/evaluation/event1.py, src/evaluation/dependence_audit.py, src/evaluation/ledger.py,
       src/models, src/physics, src/utils, src/data/folds.py, src/data/network.py,
       src/data/nhdplus.py, src/data/readers.py, src/data/io.py, src/data/srnd_frame.py, src/data/ind_features.py,
       data/processed/site_table.parquet, data/processed/splits/fold_assignment.parquet,
       data/processed/splits/srnd_assignment.parquet, data/processed/ind/ehydro_ind.parquet,
       data/processed/ind/ehydro_ind_features.parquet, data/processed/srnd/srnd_frame.parquet,
       data/raw/nhdplusv21, data/processed/predictions/audit_inputs.parquet]
    outs:
      - reports/results/audit.json: {cache: false, persist: true}
      - reports/results/audit_strata.parquet: {cache: false, persist: true}
  select_mstar:                                       # 7, Event 2 (docs/3 4.4)
    cmd: python scripts/evaluate.py select-mstar
    deps:
      [scripts/evaluate.py, params.yaml, uv.lock, src/config.py, src/evaluation/events.py,
       src/evaluation/event1.py, src/evaluation/event2.py, src/evaluation/dependence_audit.py,
       src/evaluation/hypotheses.py, src/evaluation/metrics.py, src/evaluation/ledger.py,
       src/models, src/physics, src/utils, src/data/folds.py, src/data/io.py,
       src/data/srnd_frame.py, src/data/ind_features.py, data/processed/site_table.parquet,
       data/processed/splits/fold_assignment.parquet,
       data/processed/splits/srnd_assignment.parquet, data/processed/ind/ehydro_ind.parquet,
       data/processed/ind/ehydro_ind_features.parquet, data/processed/srnd/srnd_frame.parquet,
       data/processed/predictions/M1.parquet, data/processed/predictions/M2-MLP.parquet,
       data/processed/predictions/M2-XGB.parquet]
    outs:
      - reports/results/mstar.json: {cache: false, persist: true}
  evaluate:                                           # 8, Event 3 (docs/3 13.4, 13.13)
    cmd: python scripts/evaluate.py evaluate
    deps:
      [scripts/evaluate.py, params.yaml, uv.lock, src/config.py, src/evaluation, src/models,
       src/physics, src/utils, src/data/external.py, src/data/folds.py, src/data/io.py,
       src/data/network.py, src/data/nhdplus.py, src/data/readers.py, src/data/srnd_frame.py,
       src/data/ind_features.py, data/processed/site_table.parquet,
       data/processed/splits/fold_assignment.parquet,
       data/processed/splits/srnd_assignment.parquet, data/processed/ind/ehydro_ind.parquet,
       data/processed/ind/ehydro_ind_features.parquet, data/processed/srnd/srnd_frame.parquet,
       data/processed/qc/hydroswot_init.parquet, data/raw/nhdplusv21, data/raw/hyg,
       data/processed/predictions/A_J.parquet, data/processed/predictions/M-null.parquet,
       data/processed/predictions/M0.parquet, data/processed/predictions/M1.parquet,
       data/processed/predictions/M1_A4.parquet, data/processed/predictions/M2-MLP.parquet,
       data/processed/predictions/M2-MLP_A4.parquet, data/processed/predictions/M2-XGB.parquet,
       data/processed/predictions/M2-XGB_A4.parquet, data/processed/predictions/M3.parquet,
       data/processed/predictions/M4.parquet, data/processed/predictions/M5.parquet,
       data/processed/predictions/M5_A1.parquet, data/processed/predictions/M5_A2.parquet,
       data/processed/predictions/M5_A3-SP.parquet, data/processed/predictions/M5_A3-SR.parquet,
       data/processed/predictions/M5_A4.parquet, data/processed/predictions/M5_wA1.parquet,
       data/processed/predictions/M6-NN.parquet, data/processed/predictions/M6-XGB.parquet,
       reports/results/audit.json, reports/results/audit_strata.parquet,
       reports/results/mstar.json]
    outs:
      - reports/results/event3_hypotheses.json: {cache: false, persist: true}
      - reports/results/event3_uq.json: {cache: false, persist: true}
      - reports/results/event3_consistency.json: {cache: false, persist: true}
      - reports/results/event3_dependence.json: {cache: false, persist: true}
      - reports/results/event3_descriptive.json: {cache: false, persist: true}
      - reports/results/event3_matrix.parquet: {cache: false, persist: true}
      - reports/results/event3.json: {cache: false, persist: true}

  # ---- Phase 9 (P9-D3 (a), P9-D8 (a)): publication figures and diagnostic tables.
  # Isolated plotting environment (`figures/uv.lock`, no main `uv.lock` dep); torch- and
  # xgboost-free (ADL-051, ADL-086). Outputs are git-tracked (`cache: false, persist: true`).
  figures:
    cmd: >-
      UV_PROJECT_ENVIRONMENT="$HOME/.venvs/ANN_XS_Estimation_figures"
      uv run --project figures --frozen python -B scripts/make_figures.py
    deps:
      [scripts/make_figures.py, figures/pyproject.toml, figures/uv.lock,
       figures/src/annxs_figures,
       reports/results/scoring_ledger.json, reports/results/audit.json,
       reports/results/audit_strata.parquet, reports/results/mstar.json,
       reports/results/event3.json, reports/results/event3_hypotheses.json,
       reports/results/event3_uq.json, reports/results/event3_consistency.json,
       reports/results/event3_dependence.json, reports/results/event3_descriptive.json,
       reports/results/event3_matrix.parquet,
       reports/run_manifest.json, reports/training/curves.json,
       reports/training/xi.json, reports/training/summary.json,
       data/processed/site_table.parquet,
       data/processed/splits/fold_assignment.parquet,
       data/processed/splits/srnd_assignment.parquet,
       data/processed/ind/ehydro_ind.parquet,
       data/raw/physiography, data/raw/nhdplusv21,
       data/processed/predictions/audit_inputs.parquet,
       data/processed/predictions/A_J.parquet, data/processed/predictions/M-null.parquet,
       data/processed/predictions/M0.parquet, data/processed/predictions/M1.parquet,
       data/processed/predictions/M1_A4.parquet, data/processed/predictions/M2-MLP.parquet,
       data/processed/predictions/M2-MLP_A4.parquet, data/processed/predictions/M2-XGB.parquet,
       data/processed/predictions/M2-XGB_A4.parquet, data/processed/predictions/M3.parquet,
       data/processed/predictions/M4.parquet, data/processed/predictions/M5.parquet,
       data/processed/predictions/M5_A1.parquet, data/processed/predictions/M5_A2.parquet,
       data/processed/predictions/M5_A3-SP.parquet, data/processed/predictions/M5_A3-SR.parquet,
       data/processed/predictions/M5_A4.parquet, data/processed/predictions/M5_wA1.parquet,
       data/processed/predictions/M6-NN.parquet, data/processed/predictions/M6-XGB.parquet]
    outs:
      - docs/figures: {cache: false, persist: true}
      - docs/tables: {cache: false, persist: true}
